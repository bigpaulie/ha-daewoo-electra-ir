[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/test_climate_behavior.py" = ["E402"]
"tests/test_config_flow.py" = ["E402"]
"tests/runtime_smoke.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
